# v* 태그를 push 하면 맥 앱(universal .dmg)을 빌드해 GitHub Release 에 올린다.
# 액션은 커밋 SHA 로 고정하고, 쓰기 토큰은 디스크에 남기지 않고 릴리즈 업로드 단계에만 준다
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write # Release 생성·업로드
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: 테스트
        run: |
          node --test src/
          cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 앱 안 자동 업데이트가 받는 파일에 서명한다. 공개키는 tauri.conf.json 에 있다
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '토론 무대 ${{ github.ref_name }}'
          releaseBody: '.dmg 를 받아 Applications 로 옮기세요. 서명되지 않은 앱이라 처음 열 때는 README 의 "처음 열 때" 안내를 따르세요.'
          releaseDraft: false
          args: --target universal-apple-darwin
